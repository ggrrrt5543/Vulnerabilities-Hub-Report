# Фрагмент для существующего блока http {}, не отдельный nginx.conf.
# burst допускает кратковременный всплеск, превышение возвращает 429.
limit_req_zone $binary_remote_addr zone=password_reset:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;

# Добавить в существующий HTTPS server {} и настроить upstream backend отдельно:
