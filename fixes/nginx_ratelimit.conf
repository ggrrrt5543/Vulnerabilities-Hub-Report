#     limit_req_status 429;
#     proxy_pass http://backend;
# }
# location /api/ {
#     limit_req zone=api_general burst=20 nodelay;
#     limit_req_status 429;
#     proxy_pass http://backend;
# }
# Если backend за доверенным прокси, настройте real_ip только для его адресов.
